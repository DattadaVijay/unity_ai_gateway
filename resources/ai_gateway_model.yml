resources:
  model_serving_endpoints:
    llama_endpoint:
      name: llama-3-3-70b-${bundle.target}
      config:
        served_entities:
          - name: llama-3-3-70b-hosted
            entity_name: system.ai.databricks-meta-llama-3-3-70b-instruct
            entity_version: "1"
            min_provisioned_throughput: 0
            max_provisioned_throughput: 9600
      ai_gateway:
        usage_tracking_config:
          enabled: true
        inference_table_config:
          enabled: true
          catalog_name: ${var.catalog}
          schema_name: ${var.schema}
          table_name_prefix: llama_endpoint